}

"Issue details."
type BomIssue {
  "Description of the issue (e.g., *This part is RoHS Non-Compliant*)."
  description: String! @cost(weight: "10")
  "Health check definition."
  healthCheck: BomHealthCheck! @cost(weight: "10")
  "Health check definition ID."
  healthcheckDefinitionId: String! @cost(weight: "10") @deprecated(reason: "Use healthCheck.healthCheckId instead.")
  "Recommended action to address the issue produced by the health check (e.g., *Consider using a different Manufacturer Part Number*)."
  howToFix: String @cost(weight: "10")
