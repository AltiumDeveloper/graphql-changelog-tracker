"Information about pagination in a connection."
type PageInfo {
  "When paginating forwards, the cursor to continue."
  endCursor: String @cost(weight: "10")
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean! @cost(weight: "10")
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean! @cost(weight: "10")
  "When paginating backwards, the cursor to continue."
  startCursor: String @cost(weight: "10")
}

type PlatformQueries {
  "Context for `TokenQueries`."
  token: TokenQueries! @cost(weight: "10")
}

"Error returned by the Token API when a new client secret for a `PlatformWorkspaceRefreshToken` could not be created."
type PlatformRefreshTokenCreateNewSecretError implements Error {
  message: String! @cost(weight: "10")
}

"A connection to a list of items."
type PlatformTokenConnection {
  "A list of edges."
  edges: [PlatformTokenEdge!] @cost(weight: "10")
  "A flattened list of the nodes."
  nodes: [PlatformToken!] @cost(weight: "10")
  "Information to aid in pagination."
  pageInfo: PageInfo! @cost(weight: "10")
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

"Error returned by the Token API when a `PlatformToken` could not be deleted."
type PlatformTokenDeleteFailedError implements Error {
  message: String! @cost(weight: "10")
}

"Error returned by the Token API when a `PlatformToken` could not be fully deleted, leaving it in an inconsistent state."
type PlatformTokenDeletePartiallyFailedError implements Error {
  message: String! @cost(weight: "10")
}

type PlatformTokenDeletePayload {
  errors: [PlatformTokenDeleteError!] @cost(weight: "10")
  tokenId: String @cost(weight: "10")
}

"Error returned by the Token API when a client secret for a `PlatformWorkspaceRefreshToken` could not be deleted."
type PlatformTokenDeleteRefreshTokenSecretError implements Error {
  message: String! @cost(weight: "10")
}

"An edge in a connection."
type PlatformTokenEdge {
  "A cursor for use in pagination."
  cursor: String! @cost(weight: "10")
  "The item at the end of the edge."
