schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

"Represents a shared part of work-in-progress BOMs and releases of BOMs."
interface Bom {
  "Effective health checks applicable to this BOM."
  healthChecks: [BomHealthCheck!]!
  "ID of the BOM."
  id: ID!
  """
  List of incomplete health checks.
  Some issues reported by these health checks may already be reported and included in the response, but the full set is still being processed and new issues may appear.
  """
  incompleteHealthChecks: [BomHealthCheck!]!
  "Issues associated with the BOM."
  issues: [BomIssue!]!
  "A list of all custom BOM item element's attributes."
  itemElementAttributes: [BomItemElementAttribute!]!
  "BOM items."
  items("Returns the elements in the list that come after the specified cursor." after: String "Returns the elements in the list that come before the specified cursor." before: String "Returns the first _n_ elements from the list." first: Int "Returns the last _n_ elements from the list." last: Int): BomItemsConnection
  "Name of the BOM."
  name: String!
  "Settings of the BOM (e.g., currency, production quantity, etc.)."
  settings: BomSettings!
  "Sources of the BOM (e.g., a file, a design, or other BOMs)."
  sources: [BomSource!]!
}

"A common interface for all errors that might occur in mutations."
interface BomError {
  "Error message."
  message: String!
}

"An element (part) that might be used for a particular BOM item."
interface BomItemElement {
  "Values of custom element attributes."
  attributeValues: [BomItemElementAttributeValue!]!
  "A reference to a linked component."
  componentReference: BomComponentReference
  "Description of the element."
  description: String!
  "Unique ID of the element."
  elementId: String!
  "Issues associated with the element."
  issues: [BomIssue!]!
  "Manufacturer name."
  manufacturer: String!
  "MPN stands for Manufacturer Part Number. It is a unique identifier issued by manufacturers that identifies individual products."
  mpn: String!
  "Name of the element."
  name: String!
  "Identifier of the linked part."
  partId: String
  "A reference to a linked part."
  partReference: BomPartReference
  "Selected offer of the element."
  selectedOffer: BomSelectedElementOffer
}

"Base type of a BOM element attribute value."
interface BomItemElementAttributeValue {
  "The attribute the value belongs to."
  attribute: BomItemElementAttribute!
  "Display value of the attribute."
  displayValue: String!
}

"Describes the source used to create the current BOM (e.g., a file, a design, or other BOM)."
interface BomSource {
  "Quantity of the source (i.e., how many times the source is included into this BOM)."
  quantity: Int!
}

interface DesPermission {
  "Indicates what actions can be performed on the permission."
  availableActions: DesPermissionAvailableActions!
  "Trustee's indentificator."
  trusteeId: ID!
  "Indicates read\/write permissions."
  trusteePermissions: DesTrusteePermissions!
}

interface Error {
  message: String!
}

interface GloCusAssignment {
  active: Boolean!
