"Health check description."
type BomHealthCheck {
  "Category the health check belongs to (e.g., *Supply Chain*, *Manufacturer Lifecycles*)."
  category: BomHealthCheckCategory! @cost(weight: "10")
  "Description of the health check (e.g., *This part is RoHS Non-Compliant*)."
  description: String! @cost(weight: "10")
  """
  If set, designates the name of a group the health check belongs to.
  E.g., the group might be named *RoHS status*, and the descriptions of the health checks in the group might be *No*, *Yes with Exemption*, and *Unknown*.
  """
  group: String @cost(weight: "10")
  "Health check ID."
  healthCheckId: String! @cost(weight: "10")
  "Recommended action to address the issue produced by the health check (e.g., *Consider using a different Manufacturer Part Number*)."
  howToFix: String @cost(weight: "10")
  "A concise label or tag for the health check. (e.g., *RoHS Non-Compliant*)."
  label: String! @cost(weight: "10")
  "Provider of the health check."
  provider: BomHealthCheckProvider! @cost(weight: "10")
  "Severity of the health check."
  severity: BomHealthCheckSeverity! @cost(weight: "10")
}

"Information about the health check category (e.g., *Supply Chain*, *Manufacturer Lifecycles*)."
type BomHealthCheckCategory {
  "ID of the category."
  categoryId: String! @cost(weight: "10")
  "Name of the category."
  name: String! @cost(weight: "10")
}

"Information about the health check provider."
type BomHealthCheckProvider {
  "Name of the provider."
