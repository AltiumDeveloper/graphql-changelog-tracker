schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Query {
  "Get the specified BOM."
  bomBom(
    "ID of the BOM."
    bomId: String!): BomWip!
  "Get the specified BOM release."
  bomBomRelease(
    "ID of the BOM."
    bomId: String!,
    "ID of the release."
    releaseId: String!): BomRelease!
  "Get all available BOMs in the workspace."
  bomBoms(
    "Returns the first N elements from the list."
    first: Int,
    "Returns the elements in the list that come after the specified cursor."
    after: String,
    "Returns the last N elements from the list."
    last: Int,
    "Returns the elements in the list that come before the specified cursor."
    before: String): BomBomsConnection
  "Search annotations within a project with results in paged groups."
  desAnnotations(
    projectId: String!,
    where: RequirementFilterInput,
    "Returns the first N elements from the list."
    first: Int,
    "Returns the elements in the list that come after the specified cursor."
    after: String,
    "Returns the last N elements from the list."
    last: Int,
    "Returns the elements in the list that come before the specified cursor."
    before: String): DesAnnotationsConnection
  desBomById(id: ID!): DesBom @deprecated(reason: "Use `desWipVariantById` or `desReleaseVariantById` in order to access BOM.")
  "Search for a specific comment thread associated with a project."
  desCommentThread(
    "The node identifier for a project (This is the project field named \"id\")."
    projectId: ID!,
    "The reference identifier for a comment thread."
    threadId: String!): DesCommentThread
  "Search for comment threads associated with a project."
  desCommentThreads(
    "The node identifier for a project (This is the project field named \"id\")."
    projectId: ID!): [DesCommentThread!]!
  "Search a specific component by its unique identifier."
  desComponentById(
    "The node identifier for a component."
    id: ID!): DesComponent
  "Searches multiple components by their unique identifiers."
  desComponentsByIds(
    "The node identifiers for components."
    ids: [ID!]!): [DesUnionPayload!]!
  "Searches for a specific template for a component by its unique identifier."
  desComponentTemplateById(
    "The node identifier for a component template."
    id: ID!): DesComponentTemplate
  desDesignItemById(id: ID!): DesDesignItem
  "Searches for a specific folder by its unique identifier."
  desFolderById(
    "The node identifier for a folder."
    id: ID!): DesFolder
  "Searches for a specific footprint by its unique identifier."
  desFootprintById(
    "The node identifier for a footprint."
    id: ID!): DesFootprint
  "Gets the library by workspace URL."
  desLibrary(workspaceUrl: String!): DesLibrary!
  "Gets the first allowed life cycle by the content kind."
  desLifeCycleDefinitionByContentTypeKind(workspaceUrl: String!, kind: DesContentTypeKind!): DesLifeCycleDefinition!
  "Gets a life cycle definition based on the id provided."
  desLifeCycleDefinitionById(id: ID!): DesLifeCycleDefinition
  "Gets life cycle definitions."
  desLifeCycleDefinitions(workspaceUrl: String!): [DesLifeCycleDefinition!]!
  "Gets the manufacture package by its unique identifier."
  desManufacturePackageById(
    "The node identifier for manufacture package."
    id: ID!): DesManufacturePackage
  desManufacturePackages: [DesManufacturePackage!]!
  "Gets a part by its identifier."
  desPartById(partId: String!): DesPart
  "Searches a project by its node identifier."
  desProjectById(
    "The project node identifier."
    id: ID!): DesProject
  "The project latest ECAD or MCAD revision."
  desProjectCollaborationLatestRevision(
    "The node identifier for a specific project."
    projectId: ID!,
    "The collaboration domain."
    domain: DesCollaborationDomain!): DesCollaborationRevision
  "The project ECAD or MCAD revisions returned by pages."
  desProjectCollaborationRevisions(
    "The node identifier for a specific project."
    projectId: ID!,
    domain: DesCollaborationDomain!,
    "Returns the first N elements from the list."
    first: Int,
    "Returns the elements in the list that come after the specified cursor."
    after: String,
    "Returns the last N elements from the list."
    last: Int,
    "Returns the elements in the list that come before the specified cursor."
    before: String): DesCollaborationRevisionConnection
  "*PROTOTYPE, SUBJECT TO CHANGE*"
  desProjectCollaborationSimulationLatestRevision(projectId: ID!, domainName: String!, projectTypeName: String!): DesCollaborationSimulationRevision
  "*PROTOTYPE, SUBJECT TO CHANGE*"
  desProjectCollaborationSimulationRevisions(
    projectId: ID!,
    domainName: String!,
    "Returns the first N elements from the list."
    first: Int,
    "Returns the elements in the list that come after the specified cursor."
    after: String,
    "Returns the last N elements from the list."
    last: Int,
    "Returns the elements in the list that come before the specified cursor."
    before: String): DesCollaborationSimulationRevisionConnection
  "Gets the project node ID from its internal ID."
  desProjectIdFromAfsId(
    "The web address of a workspace."
    workspaceUrl: String!,
    "AFS internal identifier."
    afsId: String!,
    "True for shared projects."
    isSharedProject: Boolean): DesProjectIdPayload!
  "Search projects within a workspace with results in paged groups."
  desProjects(
    "The web address of a workspace."
    workspaceUrl: String!,
    "Requirements block filter."
    requirementsBlockFilter: DesProjectsRequirementsBlockFilterInput,
    "Returns the first N elements from the list."
    first: Int,
    "Returns the elements in the list that come after the specified cursor."
    after: String,
    "Returns the last N elements from the list."
    last: Int,
    "Returns the elements in the list that come before the specified cursor."
    before: String,
    where: DesProjectFilterInput): DesProjectConnection
  "The list of project tasks."
  desProjectTasks(
    "The node identifier for a specific project."
    projectId: ID!,
    "Returns the first N elements from the list."
    first: Int,
    "Returns the elements in the list that come after the specified cursor."
    after: String,
    "Returns the last N elements from the list."
    last: Int,
    "Returns the elements in the list that come before the specified cursor."
    before: String): DesTaskConnection
  "Searches for a project template by its identifier."
  desProjectTemplateById(
    "The project template node identifier."
    id: ID!): DesProjectTemplate
  "Searches a release by its node identifier."
  desReleaseById(
    "The release node identifier."
    id: ID!): DesRelease
  "Searches a release variant by its node identifier."
  desReleaseVariantById(
    "The release variant node identifier."
    id: ID!): DesReleaseVariant
  "Find a specific reuse block by its unique identifier."
  desReuseBlockById(
    "The node identifier for a reuse block."
    id: ID!): DesReuseBlock
  "Find a specific reuse block revision by its unique identifier."
  desReuseBlockRevisionById(
    "The node identifier for a reuse block revision."
    id: ID!): DesReuseBlockRevision
  "Searches details of a revision by its unique identifier."
  desRevisionDetailsById(
    "The node identifier for specific revision details."
    id: ID!): DesRevisionDetails
  "Gets the first allowed naming scheme by the content kind."
  desRevisionNamingSchemeByContentTypeKind(workspaceUrl: String!, kind: DesContentTypeKind!): DesRevisionNamingScheme!
  "Gets a revision naming scheme based on the ID provided."
  desRevisionNamingSchemeById(id: ID!): DesRevisionNamingScheme
  "Gets revision naming schemes."
  desRevisionNamingSchemes(workspaceUrl: String!): [DesRevisionNamingScheme!]!
  "*PROTOTYPE, SUBJECT TO CHANGE*. Searches for components where one of the provided MPNs matches a part choice."
  desSearchComponentsByMpns(input: [DesSearchComponentByMpnInput!]!): [DesSearchComponentResult!]!
  "Gets the specified settings."
  desSettings(workspaceUrl: String!, names: [String!]!): [String]!
  desSharedWithMe: DesSharedWithMe!
  "Searches for a specific symbol by its unique identifier."
  desSymbolById(
    "The node identifier for a symbol."
    id: ID!): DesSymbol
  "Gets the specified workspace team."
  desTeam(workspaceUrl: String!): DesTeam!
  "Gets the authorized user."
  desUserByAuth: DesUser!
  "Gets a user by the specified global ID."
  desUserByGlobalId(id: String!): DesUser
  "Gets the specified workspace users by IDs."
  desUsers(workspaceUrl: String!, ids: [String!]!): [DesUser]!
  "Searches a project variant by its node identifier."
  desWipVariantById(
    "The project variant node identifier."
    id: ID!): DesWipVariant
  "Search a specific workspace by its unique identifier."
  desWorkspaceById(
    "The node identifier for a workspace."
    id: ID!): DesWorkspace
  "Search a specific workspace by its URL."
  desWorkspaceByUrl(workspaceUrl: String!): DesWorkspace
  "Gets the workspace configuration."
  desWorkspaceConfiguration(workspaceUrl: String!): DesWorkspaceConfiguration!
  "Search for workspaces associated with this account."
  desWorkspaceInfos: [DesWorkspaceInfo!]!
  "Get a list of workspace locations."
  desWorkspaceLocations: [DesWorkspaceLocation!]!
  "The list of workspace tasks."
  desWorkspaceTasks(
    "The URL of the workspace to get tasks from."
    workspaceUrl: String!,
    "Returns the first N elements from the list."
    first: Int,
    "Returns the elements in the list that come after the specified cursor."
    after: String,
    "Returns the last N elements from the list."
    last: Int,
    "Returns the elements in the list that come before the specified cursor."
    before: String): DesTaskConnection
  "Retrieves a workspace team based on the authenticity of the requester."
  desWorkspaceTeamByAuth: DesWorkspaceTeam!
  "Retrieves a list of registered extension points."
  gloCusExtensionPoints(where: GloCusExtensionPointFilterInput, order: [GloCusExtensionPointSortInput!]): [GloCusExtensionPoint!]!
  "Retrieves the execution info by execution identifier."
  gloCusScriptExecutionInfo(scriptExecutionId: String!): GloCusScriptExecutionInfo
  "Retrieves the information about subscription with given identifier."
  gloEvtSubscriptionById(subscriptionId: String!): GloEvtSubscription
  "Retrieves a script by its ID."
  gloScrScript(scriptId: String!): GloScrScript
  "Retrieves the execution result of a script by its execution ID."
  gloScrScriptExecutionResult(scriptExecutionId: String!): GloScrScriptExecution
  "Retrieves the execution results of a script by its script ID and version ID."
  gloScrScriptExecutionResults(
    scriptId: String!,
    versionId: String,
    "Returns the first N elements from the list."
    first: Int,
    "Returns the elements in the list that come after the specified cursor."
    after: String,
    "Returns the last N elements from the list."
    last: Int,
    "Returns the elements in the list that come before the specified cursor."
    before: String,
    order: [GloScrScriptExecutionSortInput!]): GloScrScriptExecutionConnection
  "Retrieves a list of scripts with pagination options."
  gloScrScripts(
    "Returns the first N elements from the list."
    first: Int,
    "Returns the elements in the list that come after the specified cursor."
    after: String,
    "Returns the last N elements from the list."
    last: Int,
    "Returns the elements in the list that come before the specified cursor."
    before: String,
    order: [GloScrScriptSortInput!]): GloScrScriptConnection
  "Fetches an object given its ID."
  node(
    "ID of the object."
    id: ID!): Node
  "Lookup nodes by a list of IDs."
  nodes(
    "The list of node IDs."
    ids: [ID!]!): [Node]!
}

type Mutation {
  "Changes the lifecycle state of the specified BOM release by applying the specified transition."
  bomChangeBomReleaseLifecycleState(input: BomChangeBomReleaseLifecycleStateInput!): BomChangeBomReleaseLifecycleStatePayload!
  "Creates a new BOM."
  bomCreateBom(input: BomCreateBomInput!): BomCreateBomPayload!
  "Exports the specified BOM into a file and provides a download URL."
  bomExportBom(input: BomExportBomInput!): BomExportBomPayload!
  "Exports the specified BOM release into a file and provides a download URL."
  bomExportBomRelease(input: BomExportBomReleaseInput!): BomExportBomReleasePayload!
  "Adds part choices of the specified component."
  desAddComponentPartChoices(input: DesAddComponentPartChoicesInput!): DesAddComponentPartChoicesPayload!
  "Adds users to the specified group."
  desAddUsersToGroup(input: DesAddUsersToGroupInput!): DesAddUsersToGroupPayload!
  "Creates a new comment."
  desCreateComment(input: DesCreateCommentInput!): DesCreateCommentPayload!
  "Creates a new comment thread."
  desCreateCommentThread(input: DesCreateCommentThreadInput!): DesCreateCommentThreadPayload!
  "Creates a folder in the library."
  desCreateFolder(input: DesCreateFolderInput!): DesCreateFolderPayload!
  "Creates the provided life cycle definition, with associated states, stages and state transitions."
  desCreateLifeCycleDefinition(input: DesCreateLifeCycleDefinitionInput!): DesCreateLifeCycleDefinitionPayload!
  "Creates a project task. A task is a job activity in Altium 365."
  desCreateProjectTask(input: DesCreateProjectTaskInput!): DesCreateTaskPayload!
  "Creates a revision naming scheme."
  desCreateRevisionNamingScheme(input: DesCreateRevisionNamingSchemeInput!): DesCreateRevisionNamingSchemePayload!
  "Creates a symbol."
  desCreateSymbol(input: DesCreateSymbolInput!): DesCreateSymbolPayload!
  "Creates a new comment for the specified task."
  desCreateTaskComment(input: DesCreateTaskCommentInput!): DesCreateTaskCommentPayload!
  "Creates a user."
  desCreateUser(input: DesCreateUserInput!): DesCreateUserPayload!
  "Creates a new user group."
  desCreateUserGroup(input: DesCreateUserGroupInput!): DesCreateUserGroupPayload!
  "Creates a workspace task. A task is a job activity in Altium 365."
  desCreateWorkspaceTask(input: DesCreateWorkspaceTaskInput!): DesCreateTaskPayload!
  "Permanently deletes the specified comment."
  desDeleteComment(input: DesDeleteCommentInput!): DesDeleteCommentPayload!
  "Permanently deletes a comment thread."
  desDeleteCommentThread(input: DesDeleteCommentThreadInput!): DesDeleteCommentThreadPayload!
  "Deletes the specified folder from the library."
  desDeleteFolder(input: DesDeleteFolderInput!): DesDeleteFolderPayload!
  "Deletes the provided life cycle definitions."
  desDeleteLifeCycleDefinition(input: DesDeleteLifeCycleDefinitionInput!): DesDeleteLifeCycleDefinitionPayload!
  "Deletes the revision naming scheme."
  desDeleteRevisionNamingScheme(input: DesDeleteRevisionNamingSchemeInput!): DesDeleteRevisionNamingSchemePayload!
  "Deletes the task specified by its node ID."
  desDeleteTask(input: DesDeleteTaskInput!): DesDeleteTaskPayload!
  "Deletes the specified task comment."
  desDeleteTaskComment(input: DesDeleteTaskCommentInput!): DesDeleteTaskCommentPayload!
  "Deletes the specified user."
  desDeleteUser(input: DesDeleteUserInput!): DesDeleteUserPayload!
  "Deletes the specified user group."
  desDeleteUserGroup(input: DesDeleteUserGroupInput!): DesDeleteUserGroupPayload!
  "Launches a workflow. Workflows allow you to automate design processes, and are created in Altium 365."
  desLaunchWorkflow(input: DesLaunchWorkflowInput!): DesLaunchWorkflowPayload!
  "Moves the specified folder in the library."
  desMoveFolder(input: DesMoveFolderInput!): DesMoveFolderPayload!
  "Releases the specified component."
  desReleaseComponent(input: DesReleaseComponentInput!): DesReleaseComponentPayload!
  "Creates and releases the specified component template."
  desReleaseComponentTemplate(input: DesReleaseComponentTemplateInput!): DesReleaseComponentTemplatePayload!
  "Removes part choices of the specified component."
  desRemoveComponentPartChoices(input: DesRemoveComponentPartChoicesInput!): DesRemoveComponentPartChoicesPayload!
  "Removes users from the specified group."
  desRemoveUsersFromGroup(input: DesRemoveUsersFromGroupInput!): DesRemoveUsersFromGroupPayload!
  "Link/unlink A365 project with requirements block component."
  desSetProjectRequirementsBlock(input: DesSetProjectRequirementsBlockInput!): DesSetProjectRequirementsBlockPayload!
  "Terminates a workflow. Workflows allow you to automate design processes, and are created in Altium 365."
  desTerminateWorkflows(input: DesTerminateWorkflowsInput!): DesTerminateWorkflowsPayload!
  "Updates the specified comment."
  desUpdateComment(input: DesUpdateCommentInput!): DesUpdateCommentPayload!
  "Updates item parameters for the specified component (does not affect the revision)."
  desUpdateComponentItemParameters(input: DesUpdateComponentItemParametersInput!): DesUpdateComponentItemParametersPayload!
  "Updates life cycle state for the provided component."
  desUpdateComponentLifeCycleState(input: DesUpdateComponentLifeCycleStateInput!): DesUpdateComponentLifeCycleStatePayload!
  "Updates parameters for the specified component (creates a new revision)."
  desUpdateComponentRevisionParameters(input: DesUpdateComponentRevisionParametersInput!): DesUpdateComponentRevisionParametersPayload!
  "Updates the specified component template."
  desUpdateComponentTemplate(input: DesUpdateComponentTemplateInput!): DesUpdateComponentTemplatePayload!
  "Updates the specified folder in the library."
  desUpdateFolder(input: DesUpdateFolderInput!): DesUpdateFolderPayload!
  "Updates the permissions for the associated folder."
  desUpdateFolderPermissions(input: DesUpdateFolderPermissionsInput!): DesUpdateFolderPermissionsPayload!
  "Updates life cycle state for the provided footprint."
  desUpdateFootprintLifeCycleState(input: DesUpdateFootprintLifeCycleStateInput!): DesUpdateFootprintLifeCycleStatePayload!
  "Updates the defined life cycle definition with those provided."
  desUpdateLifeCycleDefinition(input: DesUpdateLifeCycleDefinitionInput!): DesUpdateLifeCycleDefinitionPayload!
  "Updates the owner for the associated project."
  desUpdateProjectOwner(input: DesUpdateProjectOwnerInput!): DesUpdateProjectOwnerPayload!
  "Updates parameters for the specified project (does not affect the revision)."
  desUpdateProjectParameters(input: DesUpdateProjectParametersInput!): DesUpdateProjectParametersPayload!
  "Updates the permissions for the associated project."
  desUpdateProjectPermissions(input: DesUpdateProjectPermissionsInput!): DesUpdateProjectPermissionsPayload!
  "Updates a specific result block."
  desUpdateReuseBlock(input: DesUpdateReuseBlockInput!): DesUpdateReuseBlockPayload!
  "Updates a revision naming scheme."
  desUpdateRevisionNamingScheme(input: DesUpdateRevisionNamingSchemeInput!): DesUpdateRevisionNamingSchemePayload!
  "Updates the value associated with the specified setting."
  desUpdateSetting(input: DesUpdateSettingInput!): DesUpdateSettingPayload!
  "Updates life cycle state for the provided symbol."
  desUpdateSymbolLifeCycleState(input: DesUpdateSymbolLifeCycleStateInput!): DesUpdateSymbolLifeCycleStatePayload!
  "Updates the specified task."
  desUpdateTask(input: DesUpdateTaskInput!): DesUpdateTaskPayload!
  "Updates the specified task comment."
  desUpdateTaskComment(input: DesUpdateTaskCommentInput!): DesUpdateTaskCommentPayload!
  "Updates the specified user properties."
  desUpdateUser(input: DesUpdateUserInput!): DesUpdateUserPayload!
  "Updates the specified user group."
  desUpdateUserGroup(input: DesUpdateUserGroupInput!): DesUpdateUserGroupPayload!
  "Uploads the specified collaboration."
  desUploadCollaboration(input: DesUploadCollaborationInput!): DesUploadCollaborationPayload!
  "*PROTOTYPE, SUBJECT TO CHANGE*"
  desUploadCollaborationSimulation(input: DesUploadCollaborationSimulationInput!): DesUploadCollaborationSimulationPayload!
  "Uploads the project zip file."
  desUploadProject(input: DesUploadProjectInput!): DesUploadProjectPayload!
  "Add new assignment to extension point."
  gloCusAddAssignment(input: GloCusAddAssignmentInput!): GloCusAddAssignmentPayload!
  "Deletes an existing assignment."
  gloCusDeleteAssignment(input: GloCusDeleteAssignmentInput!): GloCusDeleteAssignmentPayload!
  "Executes an existing assignment."
  gloCusExecuteAssignment(input: GloCusExecuteAssignmentInput!): GloCusExecuteAssignmentPayload!
  "Updates an existing assignment."
  gloCusUpdateAssignment(input: GloCusUpdateAssignmentInput!): GloCusUpdateAssignmentPayload!
  "Updates configuration parameters of an Extension point."
  gloCusUpdateAssignmentConfigurations(input: GloCusUpdateAssignmentConfigurationsInput!): GloCusUpdateAssignmentConfigurationsPayload!
  "Creates webhook-based subscription with given parameters."
  gloEvtCreateWebhookSubscription(input: GloEvtCreateWebhookSubscriptionInput!): GloEvtCreateSubscriptionPayload!
  "Deletes the subscription with given identifier."
  gloEvtDeleteSubscription(input: GloEvtDeleteSubscriptionInput!): GloEvtDeleteSubscriptionPayload!
  "Publishes an event."
  gloEvtPublishEvent(input: GloEvtPublishEventInput!): GloEvtPublishEventPayload!
  "Sends e-mail to specified recipients."
  gloNtfSendEmail(input: GloNtfSendEmailInput!): GloNtfSendEmailPayload!
  "Creates a new script."
  gloScrCreateScript(input: GloScrCreateScriptInput!): GloScrCreateScriptPayload!
  "Deletes a script by its identifier."
  gloScrDeleteScript(input: GloScrDeleteScriptInput!): GloScrDeleteScriptPayload!
  "Executes a script asynchronously."
  gloScrExecuteScript(input: GloScrExecuteScriptInput!): GloScrExecuteScriptPayload!
  "Updates an existing script, creating a new version."
  gloScrUpdateScript(input: GloScrUpdateScriptInput!): GloScrUpdateScriptPayload!
}

type Subscription {
  desOnCommentUpdated(input: DesOnCommentUpdatedInput!): DesCommentNotification!
}

"The `Date` scalar represents an ISO-8601 compliant date type."
scalar Date

"The `DateTime` scalar represents an ISO-8601 compliant date time type."
scalar DateTime

"The built-in `Decimal` scalar type."
scalar Decimal

"The `Long` scalar type represents non-fractional signed whole 64-bit numeric values. Long can represent values between -(2^63) and 2^63 - 1."
scalar Long

"The multiplier path scalar represents a valid GraphQL multiplier path string."
scalar MultiplierPath

scalar URL

"A connection to a list of items."
type BomBomsConnection {
  "A list of edges."
  edges: [BomBomsEdge!]
  "A flattened list of the nodes."
  nodes: [BomWip!]
  "Information to aid in pagination."
  pageInfo: PageInfo!
}

"An edge in a connection."
type BomBomsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: BomWip!
}

type BomChangeBomReleaseLifecycleStatePayload {
  bomRelease: BomRelease
  errors: [BomError!]!
}

"A reference to a component."
type BomComponentReference {
  "ID of the referenced component."
  componentId: String!
  "ID of the referenced component revision."
  componentRevisionId: String!
}

"Information about a country."
type BomCountry {
  "ISO 3166-1 alpha-2 country code (e.g., 'US')."
  code: String!
  "Name of the country."
  name: String!
}

type BomCreateBomPayload {
  bom: BomWip
  errors: [BomError!]!
}

"Information about a currency."
type BomCurrency {
  "Currency code (e.g., 'USD')."
  code: String!
  "Unit of the currency (e.g., '$')."
  unit: String!
}

"Describes the source design release used to create the current BOM."
type BomDesignReleaseSource implements BomSource {
  "ID of the assembly used to create the BOM."
  assemblyRevisionId: String!
  "ID of the design."
  designId: String!
  "Quantity of the source (i.e., how many times the source is included into this BOM)."
  quantity: Int!
  "ID of the source revision used to create the BOM."
  sourceRevisionId: String!
}

"Describes the source design revision used to create the current BOM."
type BomDesignRevisionSource implements BomSource {
  "ID of the design."
  designId: String!
  "Quantity of the source (i.e., how many times the source is included into this BOM)."
  quantity: Int!
  "ID of the source revision used to create the BOM."
  sourceRevisionId: String!
  "Name of the variant used to create the BOM."
  variantName: String
}

"Describes the source design used to create the current BOM."
type BomDesignSource implements BomSource {
  "ID of the design."
  designId: String!
  "Quantity of the source (i.e., how many times the source is included into this BOM)."
  quantity: Int!
  "Name of the variant used to create the BOM."
  variantName: String!
}

type BomExportBomPayload {
  downloadUrl: URL
}

type BomExportBomReleasePayload {
  downloadUrl: URL
}

"Describes the source file used to create the current BOM."
type BomFileSource implements BomSource {
  "Name of the original file."
  fileName: String!
  "Quantity of the source (i.e., how many times the source is included into this BOM)."
  quantity: Int!
}

"Health check description."
type BomHealthCheck {
  "Category the health check belongs to (e.g., *Supply Chain*, *Manufacturer Lifecycles*)."
  category: BomHealthCheckCategory!
  "Description of the health check (e.g., *This part is RoHS Non-Compliant*)."
  description: String!
  """
  If set, designates the name of a group the health check belongs to.
  E.g., the group might be named *RoHS status*, and the descriptions of the health checks in the group might be *No*, *Yes with Exemption*, and *Unknown*.
  """
  group: String
  "Health check ID."
  healthCheckId: String!
  "Recommended action to address the issue produced by the health check (e.g., *Consider using a different Manufacturer Part Number*)."
  howToFix: String
  "A concise label or tag for the health check. (e.g., *RoHS Non-Compliant*)."
  label: String!
  "Provider of the health check."
  provider: BomHealthCheckProvider!
  "Severity of the health check."
  severity: BomHealthCheckSeverity!
}

"Information about the health check category (e.g., *Supply Chain*, *Manufacturer Lifecycles*)."
type BomHealthCheckCategory {
  "ID of the category."
  categoryId: String!
  "Name of the category."
  name: String!
}

"Information about the health check provider."
type BomHealthCheckProvider {
  "Name of the provider."
  name: String!
  "ID of the provider."
  providerId: String!
}

"Describes a problem with the provided input (validation error)."
type BomInputValidationError implements BomError {
  "Error message."
  message: String!
  "The path in the input where the validation failed."
  path: String
}

"Issue details."
type BomIssue {
  "Description of the issue (e.g., *This part is RoHS Non-Compliant*)."
  description: String!
  "Health check definition."
  healthCheck: BomHealthCheck!
  "Health check definition ID."
  healthcheckDefinitionId: String! @deprecated(reason: "Use healthCheck.healthCheckId instead.")
  "Recommended action to address the issue produced by the health check (e.g., *Consider using a different Manufacturer Part Number*)."
  howToFix: String
  "Severity of the issue."
  severity: BomIssueSeverity!
  "Designates that the issue is waived."
  waived: Boolean!
  """
  A waiving token enables automatic un-waiving of this issue.
  Changes to this token's value indicate significant changes in the conditions that triggered the issue.
  Attach this token to the "waive issue" command for temporary waiving. The issue will be automatically un-waived when the token's value changes.
  If this token is not provided, the corresponding health check does not support automatic un-waiving.
  """
  waivingToken: String
}

"BOM items are the components of a product."
type BomItem {
  "A reference to a linked component."
  componentReference: BomComponentReference
