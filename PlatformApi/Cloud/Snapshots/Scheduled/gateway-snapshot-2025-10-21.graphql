input BomCreateBomInput {
  "A country associated with the BOM. It is primarily used to provide region-specific information about parts."
  countryCode: String
  "A currency associated with the BOM. Prices in the BOM are provided in this currency."
  currencyCode: String
  "Description of the BOM."
  description: String
  "An optional identifier of the folder the BOM should be saved to."
  folderId: String
  "A list of custom BOM item element's attributes."
  itemElementAttributes: [BomCreateBomItemElementAttributeDeclarationInput!]
  "BOM items."
  items: [BomCreateBomItemInput!]!
  "Name of the BOM."
  name: String!
  "Specifies priorities of different packaging types. This affects the offer selection in the order list."
  packagingPriorities: BomCreateBomPackagingPrioritiesSettingsInput
  "Production-related settings of a BOM (e.g., a 'production quantity' or a 'due date')."
  production: BomCreateBomProductionSettingsInput
  "The list of suppliers to use for this BOM."
  suppliers: [BomCreateBomSupplierReferenceInput!]
  """
  If set to true, the mutation tolerates missing references instead of failing.
  
  Suppliers: Missing ones won’t be added to the BOM.
  Parts: BOM items with a non-existing part reference will remain unmapped.
  Offers: Another available offer will be selected instead.
  """
  tolerateMissingReferences: Boolean! = false
}

"Describes a BOM item element's attribute."
input BomCreateBomItemElementAttributeDeclarationInput {
  """
  A transient identifier that uniquely identifies this attribute within the current mutation call.
  This ID is used to correlate this attribute with attribute values in BOM item elements.
  """
  attributeId: String!
  "Name of the attribute."
  name: String!
  "Type of the attribute. The actual attribute values may have different types."
  type: BomItemElementCustomAttributeType!
}

"BOM item element attribute."
input BomCreateBomItemElementAttributeInput {
  """
  A transient identifier that uniquely identifies this attribute within the current mutation call.
  This ID is used to correlate this attribute with the corresponding attribute declaration.
  """
  attributeId: String!
  "Value of the attribute."
  value: BomCreateBomItemElementAttributeValueInput!
}

"BOM item element attribute's value."
input BomCreateBomItemElementAttributeValueInput {
  "Floating-point value of a BOM element attribute."
  floatValue: Float
  "Integer value of a BOM element attribute."
  integerValue: Long
  "String value of a BOM element attribute."
  stringValue: String
}

"An element (part) that might be used for a particular BOM item."
input BomCreateBomItemElementInput {
  "Values of custom element attributes."
  attributeValues: [BomCreateBomItemElementAttributeInput!]
